<!DOCTYPE html>
<html>
<head>
    <title>Lake Rendering Test</title>
    <style>
        body { margin: 0; padding: 20px; background: #f0f0f0; }
        #vis { background: white; border: 2px solid #333; }
    </style>
</head>
<body>
    <h1>Lake Rendering Test</h1>
    <div id="vis"></div>
    <div id="console-output" style="margin-top: 20px; font-family: monospace; white-space: pre;"></div>

    <script src="https://d3js.org/d3.v7.min.js"></script>
    <script src="data.js"></script>
    <script>
        const log = msg => {
            console.log(msg);
            document.getElementById('console-output').textContent += msg + '\n';
        };

        log('Starting lake rendering test...');
        log('GeoJSON features: ' + greatLakesGeoJSON.features.length);

        const width = 1000;
        const height = 600;

        const svg = d3.select("#vis")
            .append("svg")
            .attr("width", width)
            .attr("height", height)
            .style("display", "block");

        // Add a test rectangle to verify SVG is working
        svg.append("rect")
            .attr("x", 10)
            .attr("y", 10)
            .attr("width", 50)
            .attr("height", 50)
            .attr("fill", "red");

        log('Red test rectangle added at (10,10)');

        // Set up projection
        const projection = d3.geoMercator();
        const path = d3.geoPath().projection(projection);

        projection.fitSize([width, height], greatLakesGeoJSON);

        log('Projection scale: ' + projection.scale());
        log('Projection translate: ' + projection.translate());

        // Render lakes
        const lakes = svg.selectAll(".lake")
            .data(greatLakesGeoJSON.features)
            .enter()
            .append("path")
            .attr("class", "lake")
            .attr("d", d => {
                const pathStr = path(d);
                log(`Lake ${d.properties.name}: path = ${pathStr ? pathStr.substring(0, 50) + '...' : 'NULL'}`);
                return pathStr;
            })
            .attr("fill", "#4a90e2")
            .attr("stroke", "#2a5298")
            .attr("stroke-width", 2);

        log('Created ' + lakes.size() + ' lake paths');
        log('DONE! If you see blue shapes above, lakes are rendering correctly.');
    </script>
</body>
</html>
